# DarDesign CI — every push proves the API contract + the frontend build.
# Backend runs the full pytest suite in DARDESIGN_LIGHT (no GPU needed);
# frontend runs the production Next.js build (type check + lint included).
name: ci

on:
  push:
    branches: [master, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-light.txt
      - run: pip install -r backend/requirements-light.txt
      - run: python -m pytest tests -q
        env:
          DARDESIGN_LIGHT: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
